<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hess’s Law Builder</title>
<style>
:root{
  --ink:#1f2933; --muted:#5f6b7a; --line:#d9dee5; --bg:#f6f7f9; --card:#fff;
  --accent:#b4441b; --accent2:#1c5d99; --ok:#2b7a3d; --okbg:#e8f5ea; --bad:#b42318; --badbg:#fdecea;
  --hot:#d9480f; --cold:#1c7ed6; --warn:#8a5a00; --warnbg:#fff4d6;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.45}
header{background:#2a1f1a;color:#fff;padding:14px 22px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-size:22px;letter-spacing:.2px}
header .sub{color:#f3c9a8;font-size:14px}
nav{display:flex;gap:4px;background:#3a2c25;padding:0 16px}
nav button{background:none;border:0;color:#e9d8cc;padding:11px 16px;font-size:15px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:#f08c4b;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:18px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
h2{font-size:19px;margin:0 0 10px}
h3{font-size:16px;margin:16px 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 14px;font-size:14px;cursor:pointer}
button.btn:hover{filter:brightness(1.08)}
button.btn.alt{background:#fff;color:var(--accent);border:1px solid var(--accent)}
button.btn.blue{background:var(--accent2)}
button.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .n{opacity:.7;margin-left:4px}
select,input[type=text]{font-size:15px;padding:6px 8px;border:1px solid #b8c0cc;border-radius:6px;background:#fff}
input.num{width:140px;font-family:ui-monospace,Consolas,monospace}
input.ok{border-color:var(--ok);background:var(--okbg)}
input.bad{border-color:var(--bad);background:var(--badbg)}
.problem{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media (max-width:860px){.problem{grid-template-columns:1fr}}
.ptext{font-size:16.5px}
.pid{font-size:12px;color:var(--muted);margin-bottom:6px}
.scene svg{width:100%;height:auto;display:block;background:#fbfaf8;border:1px solid var(--line);border-radius:8px}
.decode{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.decode{grid-template-columns:1fr}}
.q{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fcfcfd}
.q.okq{border-color:#9fd3a9;background:#f4fbf5}
.q.badq{border-color:#f0b3ad;background:#fff8f7}
.q h4{margin:0 0 6px;font-size:14.5px}
.q label{display:block;padding:2px 0;font-size:14.5px;cursor:pointer}
.q .fb{margin-top:6px}
table.givens{border-collapse:collapse;width:auto}
table.givens td:first-child{min-width:230px}
table.givens td{padding:4px 6px;border-bottom:1px solid #eef0f3;font-size:14.5px;vertical-align:middle}
table.givens td.u{color:var(--muted);white-space:nowrap}
table.givens td.m{width:22px;text-align:center}
.fb{font-size:14px;border-radius:6px;padding:6px 10px;margin-top:6px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.rule{background:var(--warnbg);color:#5a3d00}
.fb:empty{display:none}
.mini{font-size:12.5px;color:var(--bad)}
.plan{background:#f3f6fb;border-left:4px solid var(--accent2);padding:8px 14px;border-radius:4px;margin-top:10px}
.plan ol{margin:4px 0 0 18px;padding:0}
.step{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;background:#fff}
.step.done{border-color:#9fd3a9;background:#f8fcf8}
.step .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.step .lbl{font-weight:600}
.step .sym{font-family:Georgia,serif;font-size:16px;min-width:46px}
.worked{font-family:Georgia,serif;font-size:15px;color:#24382a;margin-top:6px}
.summary{border:2px solid var(--ok);border-radius:10px;padding:12px 16px;background:#f6fbf6}
.big{font-size:20px;font-family:Georgia,serif}
.score{display:flex;gap:16px;font-size:14px}
.score b{font-size:18px}
table.ref{border-collapse:collapse;font-size:14px}
table.ref th,table.ref td{border:1px solid var(--line);padding:4px 10px;text-align:left}
table.ref th{background:#f1f3f6}
.eqn{font-family:Georgia,serif;font-size:17px;background:#fbf7f3;border:1px solid #ecdcd0;border-radius:6px;padding:6px 12px;display:inline-block;margin:4px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.callout{background:var(--warnbg);border:1px solid #f0d58a;border-radius:8px;padding:8px 12px;margin:8px 0}
textarea.copy{width:100%;height:160px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
table.up{border-collapse:collapse;font-size:13px;width:100%}
table.up td,table.up th{border:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#eef0f3;color:#3b4552}
.tag.exo{background:#fde8dd;color:#a33a0b}.tag.endo{background:#e0efff;color:#1b5fa8}
details summary{cursor:pointer;color:var(--accent2)}
kbd{font-family:ui-monospace,Consolas,monospace;background:#eef0f3;border-radius:3px;padding:0 4px}
table.cyc{border-collapse:collapse;width:100%}
table.cyc td,table.cyc th{padding:5px 8px;border-bottom:1px solid #eef0f3;font-size:14.5px;text-align:left;vertical-align:middle}
table.cyc th{font-size:13px;color:var(--muted);font-weight:600}
table.cyc td.proc{font-family:Georgia,serif;font-size:15px}
input.mult{width:64px;text-align:center;font-family:ui-monospace,Consolas,monospace}
.datalist{margin:8px 0 0;padding:8px 12px;background:#f7f8fa;border:1px solid var(--line);border-radius:8px;font-size:15px;columns:2;column-gap:24px}
.datalist div{break-inside:avoid;padding:1px 0}
.diag svg{width:100%;height:auto;display:block;background:#fbfaf8;border:1px solid var(--line);border-radius:8px}
.legend{font-size:13px;margin-top:6px;columns:2;column-gap:20px}
.legend div{break-inside:avoid}
.unk{color:var(--accent);font-weight:600}
.work{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:14px;align-items:start}
@media (max-width:1000px){.work{grid-template-columns:1fr}}
.sticky{position:sticky;top:10px}
.eqbig{font-family:Georgia,serif;font-size:18px;background:#fbf7f3;border:1px solid #ecdcd0;border-radius:6px;padding:8px 14px;display:inline-block}
.eqn2{font-family:Georgia,serif;font-size:16px}
table.steps{border-collapse:collapse;width:100%}
table.steps td,table.steps th{padding:6px 8px;border-bottom:1px solid #eef0f3;text-align:left;vertical-align:middle;font-size:14.5px}
table.steps th{font-size:13px;color:var(--muted);font-weight:600}
.cancel{text-decoration:line-through;color:#9aa3ad}
.good{color:var(--ok)} .badc{color:var(--bad);font-weight:600}
.sumbox{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:10px}
.sumbox .lab{font-size:12.5px;color:var(--muted);margin-top:4px}
label.rev{display:inline-flex;gap:4px;align-items:center;font-size:14px;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<header><h1>Hess’s Law Builder</h1><span class="sub">Flip it · scale it · add it up</span></header>
<nav id="nav">
  <button data-tab="review">Review</button>
  <button data-tab="coach" class="on">Coaching</button>
  <button data-tab="test">Testing</button>
  <button data-tab="instr">Instructor</button>
</nav>
<main>
  <section id="tab-review" class="tab"></section>
  <section id="tab-coach" class="tab on"></section>
  <section id="tab-test" class="tab"></section>
  <section id="tab-instr" class="tab"></section>
</main>
<script>
/* Hess's Law Builder — engine (no DOM; runs in Node for tests) */
var HLE = (function () {
  'use strict';

  // ---------- fractions ----------
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a || 1; }
  function F(n, d) { d = d === undefined ? 1 : d; if (d < 0) { n = -n; d = -d; } var g = gcd(n, d); return { n: n / g, d: d / g }; }
  function add(a, b) { return F(a.n * b.d + b.n * a.d, a.d * b.d); }
  function sub_(a, b) { return F(a.n * b.d - b.n * a.d, a.d * b.d); }
  function mul(a, b) { return F(a.n * b.n, a.d * b.d); }
  function div(a, b) { return F(a.n * b.d, a.d * b.n); }
  function isZero(a) { return a.n === 0; }
  function num(a) { return a.n / a.d; }
  function fromNumber(x) { // 1.5 -> 3/2 (denominators up to 12)
    for (var d = 1; d <= 12; d++) { var n = Math.round(x * d); if (Math.abs(n / d - x) < 1e-9) return F(n, d); }
    return null;
  }
  var UNI = { '½': [1, 2], '⅓': [1, 3], '¼': [1, 4], '¾': [3, 4], '⅔': [2, 3] };
  function parseFrac(s) {
    s = String(s || '').trim().replace(/\s+/g, '').replace(/[−]/g, '-');
    if (s === '') return null;
    var m = /^(-?)(\d*)([½⅓¼¾⅔])$/.exec(s);
    if (m) { var u = UNI[m[3]], w = m[2] ? +m[2] : 0; return F((m[1] ? -1 : 1) * (w * u[1] + u[0]), u[1]); }
    m = /^(-?\d+)\/(\d+)$/.exec(s); if (m) return +m[2] ? F(+m[1], +m[2]) : null;
    if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return fromNumber(parseFloat(s));
    return null;
  }
  function fracText(a, forCoef) {
    if (a.d === 1) return String(a.n).replace('-', '−');
    var sign = a.n < 0 ? '−' : '', n = Math.abs(a.n);
    if (a.d === 2 && n === 1) return sign + '½';
    return sign + n + '/' + a.d;
  }

  // ---------- formulas and equations ----------
  function atoms(formula) {
    var s = formula.replace(/\s+/g, ''), i = 0;
    function group() {
      var c = {};
      while (i < s.length && s[i] !== ')') {
        var part;
        if (s[i] === '(') { i++; part = group(); if (s[i] !== ')') throw new Error('missing ) in ' + formula); i++; }
        else { var m = /^[A-Z][a-z]?/.exec(s.slice(i)); if (!m) throw new Error('can’t read formula ' + formula); i += m[0].length; part = {}; part[m[0]] = 1; }
        var n = /^\d+/.exec(s.slice(i)), k = 1; if (n) { k = +n[0]; i += n[0].length; }
        for (var e in part) c[e] = (c[e] || 0) + part[e] * k;
      }
      return c;
    }
    var r = group(); if (i !== s.length) throw new Error('can’t read formula ' + formula); return r;
  }
  function parseSpecies(t) {
    var m = /^(.*?)\s*\(\s*(s|l|g|aq)\s*(?:,\s*([a-z ]+?))?\s*\)$/i.exec(t.trim());
    if (!m) throw new Error('“' + t + '” needs a state, like (g), (l), (s), (aq) or (s, graphite)');
    var formula = m[1].trim(), state = m[2].toLowerCase() + (m[3] ? ', ' + m[3].trim().toLowerCase() : '');
    if (!/^[A-Z(]/.test(formula)) throw new Error('can’t read “' + t + '”');
    atoms(formula);
    return { formula: formula, state: state, key: formula + '(' + state + ')' };
  }
  function parseSide(side) {
    var terms = side.split(/\s\+\s|^\+\s|\s\+$/).map(function (x) { return x.trim(); }).filter(Boolean), out = [];
    terms.forEach(function (t) {
      var m = /^((?:\d+\s*\/\s*\d+)|(?:\d*[½⅓¼¾⅔])|(?:\d+(?:\.\d+)?)|(?:\.\d+))?\s*(.*)$/.exec(t);
      var c = m[1] ? parseFrac(m[1].replace(/\s+/g, '')) : F(1);
      if (!c || c.n <= 0) throw new Error('bad coefficient in “' + t + '”');
      out.push({ c: c, sp: parseSpecies(m[2]) });
    });
    return out;
  }
  function parseEq(str) {
    var s = String(str).replace(/→|⟶|=>/g, '->');
    var parts = s.split('->');
    if (parts.length !== 2) throw new Error('use one arrow (->) in “' + str + '”');
    var L = parseSide(parts[0]), R = parseSide(parts[1]);
    if (!L.length || !R.length) throw new Error('each side needs at least one species: “' + str + '”');
    // net: products positive, reactants negative
    var net = {}, info = {};
    L.forEach(function (t) { net[t.sp.key] = sub_(net[t.sp.key] || F(0), t.c); info[t.sp.key] = t.sp; });
    R.forEach(function (t) { net[t.sp.key] = add(net[t.sp.key] || F(0), t.c); info[t.sp.key] = t.sp; });
    // atom balance
    var bal = {};
    Object.keys(net).forEach(function (k) { var a = atoms(info[k].formula); for (var e in a) bal[e] = add(bal[e] || F(0), mul(net[k], F(a[e]))); });
    var unbalanced = Object.keys(bal).filter(function (e) { return !isZero(bal[e]); });
    return { L: L, R: R, net: net, info: info, unbalanced: unbalanced, src: str };
  }
  function spHTML(sp) { return sp.formula.replace(/(\d+)/g, '<sub>$1</sub>') + '(' + sp.state + ')'; }
  function termHTML(c, sp) { return (c.n === 1 && c.d === 1 ? '' : fracText(c) + ' ') + spHTML(sp); }
  function sideHTML(terms) { return terms.map(function (t) { return termHTML(t.c, t.sp); }).join(' + '); }
  function eqHTML(eq) { return sideHTML(eq.L) + ' → ' + sideHTML(eq.R); }
  // equation from a net map (products > 0)
  function netToSides(net, info) {
    var L = [], R = [];
    Object.keys(net).forEach(function (k) { var c = net[k]; if (isZero(c)) return; (c.n > 0 ? R : L).push({ c: c.n > 0 ? c : F(-c.n, c.d), sp: info[k] }); });
    return { L: L, R: R };
  }
  // a step multiplied by x (x < 0 means reversed)
  function scaledSides(eq, x) {
    var rev = x.n < 0, f = rev ? F(-x.n, x.d) : x;
    var L = (rev ? eq.R : eq.L).map(function (t) { return { c: mul(t.c, f), sp: t.sp }; });
    var R = (rev ? eq.L : eq.R).map(function (t) { return { c: mul(t.c, f), sp: t.sp }; });
    return { L: L, R: R };
  }

  // ---------- linear solve (exact) ----------
  function solveSystem(A, t) { // A: rows species × cols steps, t: target column. Returns x or null (or 'many')
    var rows = A.length, cols = A[0].length, M = A.map(function (r, i) { return r.slice().concat([t[i]]); }), piv = [], r = 0;
    for (var c = 0; c < cols && r < rows; c++) {
      var p = -1; for (var i = r; i < rows; i++) if (!isZero(M[i][c])) { p = i; break; }
      if (p < 0) continue;
      var tmp = M[r]; M[r] = M[p]; M[p] = tmp;
      var pv = M[r][c]; for (var j = c; j <= cols; j++) M[r][j] = div(M[r][j], pv);
      for (i = 0; i < rows; i++) if (i !== r && !isZero(M[i][c])) { var f = M[i][c]; for (j = c; j <= cols; j++) M[i][j] = sub_(M[i][j], mul(f, M[r][j])); }
      piv.push(c); r++;
    }
    for (i = r; i < rows; i++) if (!isZero(M[i][cols])) return null; // inconsistent
    if (piv.length < cols) return 'many';
    var x = []; piv.forEach(function (c, k) { x[c] = M[k][cols]; }); return x;
  }

  function parseNum(s) {
    var v = String(s || '').trim().replace(/[−–]/g, '-').replace(/,/g, '').replace(/\s+/g, '').replace(/^\+/, '');
    return /^-?(\d+\.?\d*|\.\d+)$/.test(v) ? parseFloat(v) : NaN;
  }
  function fmt(x) { var r = Math.round(x * 100) / 100; if (Math.abs(r) < 1e-9) r = 0; return String(r).replace('-', '−'); }
  function sgn(x) { return (x > 0 ? '+' : '') + fmt(x); }
  function within(v, t, tol) { return isFinite(v) && Math.abs(v - t) <= Math.max(tol.abs || 0, Math.abs(t) * (tol.rel || 0)) + 1e-9; }
  var TOL = { abs: 0.6, rel: 0.002 };

  var LEVELS = { 1: 'One or two steps: flip or scale', 2: 'Two steps', 3: 'Three steps', 4: 'Four steps', 5: 'From formation reactions (ΔH°f)' };

  // ---------- solve a problem ----------
  function solve(p) {
    var target = parseEq(p.target), steps = [];
    for (var i = 1; i <= 6; i++) if (p['step' + i] && String(p['step' + i]).trim()) {
      var e = parseEq(p['step' + i]); e.dH = parseNum(p['dH' + i]); e.dHtext = String(p['dH' + i]).trim(); steps.push(e);
    }
    if (!steps.length) throw new Error('no steps given');
    var keys = {}, info = {};
    [target].concat(steps).forEach(function (e) { for (var k in e.net) { keys[k] = 1; info[k] = e.info[k]; } });
    keys = Object.keys(keys);
    var A = keys.map(function (k) { return steps.map(function (s) { return s.net[k] || F(0); }); });
    var t = keys.map(function (k) { return target.net[k] || F(0); });
    var x = solveSystem(A, t);
    if (x === null) throw new Error('the steps can’t be combined to give the target');
    if (x === 'many') throw new Error('more than one way to combine the steps (some steps are redundant)');
    var dHs = steps.map(function (s, i) { return num(x[i]) * s.dH; });
    var ans = dHs.reduce(function (a, b) { return a + b; }, 0);
    var used = steps.map(function (s, i) { return !isZero(x[i]); });

    // anchors: a species in the target that appears in only one step
    var hints = steps.map(function (s, i) {
      if (!used[i]) return 'This step isn’t needed.';
      var cands = Object.keys(s.net).filter(function (k) { return steps.filter(function (o) { return o.net[k]; }).length === 1; });
      var inT = cands.filter(function (k) { return target.net[k]; });
      var k = inT[0] || cands[0];
      if (!k) return 'Every species in this step also appears in another step. Fix the other steps first, then choose this one so the leftovers cancel.';
      var want = target.net[k] || F(0), have = s.net[k];
      var side = function (c) { return c.n > 0 ? 'a product' : 'a reactant'; };
      if (isZero(want)) return spHTML(info[k]) + ' appears only in this step and isn’t in the target, so it must cancel out… which means this step pairs with another. Work on the others first.';
      return spHTML(info[k]) + ' appears only in this step. The target has it as ' + side(want) + ' (' + fracText(F(Math.abs(want.n), want.d)) + '); this step has it as ' + side(have) + ' (' + fracText(F(Math.abs(have.n), have.d)) + '). So ' +
        (have.n * want.n < 0 ? 'reverse it' : 'keep its direction') + ' and multiply by ' + fracText(F(Math.abs(x[i].n), x[i].d)) + '.';
    });

    // variants for diagnosing totals
    var variants = [];
    steps.forEach(function (s, i) {
      if (!used[i]) return;
      var xi = num(x[i]);
      if (xi < 0) variants.push({ i: i, total: ans - 2 * dHs[i], msg: 'Step ' + (i + 1) + ' was reversed, so its ΔH changes sign. It looks like you kept the original sign.' });
      else variants.push({ i: i, total: ans - 2 * dHs[i], msg: 'Check the sign of step ' + (i + 1) + '’s ΔH. It isn’t reversed, so it keeps its sign.' });
      if (Math.abs(xi) !== 1) variants.push({ i: i, total: ans - dHs[i] + Math.sign(xi) * s.dH, msg: 'Step ' + (i + 1) + ' was multiplied by ' + fracText(F(Math.abs(x[i].n), x[i].d)) + ', so its ΔH must be multiplied by the same factor.' });
      if (Math.abs(xi) !== 1) variants.push({ i: i, total: ans - dHs[i] + s.dH * Math.sign(xi) / Math.abs(xi), msg: 'Multiply step ' + (i + 1) + '’s ΔH by ' + fracText(F(Math.abs(x[i].n), x[i].d)) + '; don’t divide.' });
    });
    var plainSum = steps.reduce(function (a, s, i) { return used[i] ? a + s.dH : a; }, 0);
    variants.push({ total: plainSum, msg: 'It looks like you added the original ΔH values. Each one must be reversed and multiplied the same way as its equation.' });

    var text = p.text && String(p.text).trim() ? p.text : 'Use the equations below to find ΔH for the target reaction.';
    return {
      id: p.id, level: +p.level, target: target, steps: steps, x: x, used: used, dHs: dHs, answer: ans, hints: hints, variants: variants, keys: keys, info: info, text: text
    };
  }

  // ---------- checks ----------
  // student manipulation: [{rev: bool, mult: string}]
  function combine(sol, choices) {
    var net = {}, err = null, xs = [];
    sol.steps.forEach(function (s, i) {
      var ch = choices[i] || {}, m = String(ch.mult === undefined ? '1' : ch.mult).trim() === '' ? F(0) : parseFrac(ch.mult);

  function renderCoach() {

    }).join('');

      '<table class="steps"><tr><th></th><th>Reverse?</th><th>Multiply</th><th>Your adjusted equation</th></tr>' + rows + '</table>' +
      '<div class="sumbox" id="sumbox"></div>' +
      '<div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button class="btn" id="bCheck">Check my sum</button><span id="bShow"></span></div><div class="fb" id="bFb"></div></div>' +
      '<div class="card" id="cDH"><h2>2 · Adjust each ΔH</h2><div id="dhBody"><p class="muted">Get the equations to add up first.</p></div></div>' +
      '<div class="card" id="cTot"><h2>3 · Add them up</h2><div id="totBody"><p class="muted">Adjust each ΔH first.</p></div></div>';
    $$('#cBuild input').forEach(function (inp) { inp.addEventListener('input', updateSum); inp.addEventListener('change', updateSum); inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') checkBuild(); }); });

  function choices() { return C.s.steps.map(function (_, i) { return { rev: $('[data-rev="' + i + '"]').checked, mult: $('[data-m="' + i + '"]').value }; }); }
  function updateSum() {
    var s = C.s, ch = choices(), comb = H.combine(s, ch);
    s.steps.forEach(function (st, i) {
      var x = comb.xs[i], el = $('#man' + i);
      if (H.isZero(x)) { el.innerHTML = '<span class="muted">(left out)</span>'; return; }
      var sc = H.scaledSides(st, x); el.innerHTML = H.sideHTML(sc.L) + ' → ' + H.sideHTML(sc.R);
    });
    if (comb.err) { $('#sumbox').innerHTML = '<span class="badc">' + comb.err + '</span>'; return; }
    // full sum with cancellations marked
    function sideList(map, other) {
      return Object.keys(map).map(function (k) {
        var c = map[k], o = other[k] || H.F(0), sp = s.info[k];
        if (H.isZero(o)) return H.termHTML(c, sp);

      }).join(' + ') || '—';
    }
    var net = H.netToSides(comb.net, s.info), bad = H.compare(s, comb.net);
    var mark = function (terms) { return terms.map(function (t) { var want = s.target.net[t.sp.key]; var ok = bad.every(function (b) { return b.key !== t.sp.key; }); return '<span class="' + (ok ? 'good' : 'badc') + '">' + H.termHTML(t.c, t.sp) + '</span>'; }).join(' + ') || '—'; };
    $('#sumbox').innerHTML = '<div class="lab">Add the adjusted steps (species on both sides are crossed out):</div><div class="eqn2">' + sideList(comb.Ls, comb.Rs) + ' → ' + sideList(comb.Rs, comb.Ls) + '</div>' +
      '<div class="lab">After canceling:</div><div class="eqn2">' + mark(net.L) + ' → ' + mark(net.R) + '</div>' +
      '<div class="lab">Target:</div><div class="eqn2">' + H.eqHTML(s.target) + '</div>' +
      (bad.length ? '' : '<div class="good" style="margin-top:4px">✓ Matches the target.</div>');
  }
  function checkBuild() {

  // ================= REVIEW =================
  function example(id, title, hidden) {

    }).join('') + '<tr><td colspan="2"><b>Sum</b></td><td class="eqn2"><b>' + H.eqHTML(s.target) + '</b></td><td><b>' + fmt(s.answer) + '</b></td></tr></table><div style="margin-top:8px;max-width:560px">' + diagram(s) + '</div>';
    return '<div class="card"><h3 style="margin-top:0">' + title + '</h3><p>' + s.text + '</p><div><b>Target:</b> <span class="eqbig">' + H.eqHTML(s.target) + '</span></div>' +
      '<table class="steps" style="margin:8px 0"><tr><th>Given</th><th>Equation</th><th>ΔH (kJ)</th></tr>' + s.steps.map(function (st, i) { return '<tr><td>Step ' + (i + 1) + '</td><td class="eqn2">' + H.eqHTML(st) + '</td><td>' + fmt(st.dH) + '</td></tr>'; }).join('') + '</table>' +
      (hidden ? '<details><summary>Show the solution</summary>' + body + '</details>' : body) + '</div>';
  }
  function renderReview() {
    $('#tab-review').innerHTML =
      '<div class="card"><h2>Hess’s law</h2><p><b>If a chemical equation can be written as the sum of other equations, its ΔH is the sum of their ΔH values.</b></p>' +
      '<p>This works because enthalpy is a <b>state function</b>: ΔH depends only on where you start and where you end, not on the path in between. So you can find ΔH for a reaction that is hard or impossible to measure (like graphite → diamond, or C + ½O₂ → CO) by adding up reactions you <i>can</i> measure.</p></div>' +
      '<div class="cols"><div class="card"><h2>Rule 1 · Multiply</h2><p>If an equation is multiplied by a factor, ΔH is multiplied by the same factor.</p>' +
      '<div class="eqn">H₂(g) + ½O₂(g) → H₂O(l) &nbsp; ΔH = −285.8 kJ</div><div class="eqn">2H₂(g) + O₂(g) → 2H₂O(l) &nbsp; ΔH = 2 × (−285.8) = −571.6 kJ</div></div>' +
      '<div class="card"><h2>Rule 2 · Reverse</h2><p>If an equation is reversed, ΔH changes sign.</p>' +
      '<div class="eqn">2H₂(g) + O₂(g) → 2H₂O(l) &nbsp; ΔH = −571.6 kJ</div><div class="eqn">2H₂O(l) → 2H₂(g) + O₂(g) &nbsp; ΔH = +571.6 kJ</div></div></div>' +
      '<div class="card"><h2>A strategy that works</h2><ol>' +
      '<li>Write the target at the top.</li>' +
      '<li>Find a species in the target that appears in <b>only one</b> given step. That step must be used so that the species ends up on the same side, with the same coefficient: reverse it if needed, then multiply.</li>' +
      '<li>Repeat for the other target species.</li>' +
      '<li>Add the adjusted equations and cancel species that appear on both sides. Everything left must be exactly the target, including states.</li>' +
      '<li>Adjust each ΔH the same way as its equation, then add.</li></ol>' +
      '<div class="callout">States matter: H₂O(l) and H₂O(g) are different species and don’t cancel each other. C(s, graphite) and C(s, diamond) are different too.</div></div>' +
      '<div class="card"><h2>The formation-reaction shortcut</h2><p>When every step is a <b>formation reaction</b> (one mole of a compound from its elements in their standard states), its ΔH is ΔH°<sub>f</sub> of that compound. Combining them by Hess’s law always gives:</p>' +
      '<div class="eqn">ΔH°<sub>rxn</sub> = Σ n·ΔH°<sub>f</sub>(products) − Σ n·ΔH°<sub>f</sub>(reactants)</div><p>Elements in their standard states (O₂(g), C(s, graphite), N₂(g)…) have ΔH°<sub>f</sub> = 0. Level 5 problems show why the shortcut works.</p></div>' +
      '<h2 style="margin:18px 0 10px">Worked examples</h2>' +
      example('H2-01', 'Example 1 · Forming CO (two steps)') + example('H3-01', 'Example 2 · Combustion of methane (slide 59)') + example('H5-01', 'Example 3 · From formation reactions (slide 61)') +
      example('H3-03', 'You try this one · Forming acetylene', true) +
      '<div class="card"><h2>How to type</h2><ul><li>Multipliers: <kbd>2</kbd>, <kbd>1/2</kbd>, <kbd>½</kbd>, <kbd>0.5</kbd>, <kbd>3/2</kbd>. Use <kbd>0</kbd> to leave a step out.</li><li>ΔH values in kJ, with sign: <kbd>-802.5</kbd> or <kbd>−802.5</kbd>.</li><li>Answers within about 0.6 kJ are accepted.</li></ul></div>';
  }

  // ================= INSTRUCTOR =================
  var TEMPLATE = [
    { id: 'X-01', level: 2, target: 'C(s, graphite) + 1/2O2(g) -> CO(g)', step1: 'C(s, graphite) + O2(g) -> CO2(g)', dH1: '-393.5', step2: 'CO(g) + 1/2O2(g) -> CO2(g)', dH2: '-283.0' },
    { id: 'X-02', level: 3, target: '2C(s, graphite) + 3H2(g) -> C2H6(g)', step1: 'C2H6(g) + 7/2O2(g) -> 2CO2(g) + 3H2O(l)', dH1: '-1560', step2: 'C(s, graphite) + O2(g) -> CO2(g)', dH2: '-393.5', step3: 'H2(g) + 1/2O2(g) -> H2O(l)', dH3: '-285.8' }
  ];
  function csvCell(v) { v = v === undefined || v === null ? '' : String(v); return /[",\n\t]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function toCSV(rows) { return H.COLUMNS.join(',') + '\n' + rows.map(function (r) { return H.COLUMNS.map(function (c) { return csvCell(r[c]); }).join(','); }).join('\n') + '\n'; }
  function parseTable(text) {
    var delim = text.split('\n')[0].indexOf('\t') >= 0 ? '\t' : ',', rows = [], row = [], cell = '', q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true; else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    rows = rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); }); if (!rows.length) return [];
    var head = rows[0].map(function (h) { return h.trim(); });
    return rows.slice(1).map(function (r) { var o = {}; head.forEach(function (h, k) { var v = (r[k] || '').trim(); if (v !== '') o[h] = v; }); return o; });
  }
  function offerFile(name, text, mime, box) {
    try { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500); } catch (e) { }
    $('#' + box).innerHTML = '<p class="small muted" style="margin:8px 0 4px">If no file downloaded (downloads are blocked in the claude.ai preview), copy this text into a file named <b>' + esc(name) + '</b>:</p><textarea class="copy" readonly>' + esc(text) + '</textarea>';
  }
  var pending = [];
  function renderInstr() {
    var up = store.get('uploads', []);
    $('#tab-instr').innerHTML =
      '<div class="card"><h2>Problem spreadsheet</h2><p>One row per problem: the target equation and up to five given steps with their ΔH. The tool checks that every equation is balanced, works out how the steps combine, and computes the answer, so there is no answer-key column.</p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="iTpl">Download template (.csv)</button><button class="btn alt" id="iCur">Download current problems (.csv)</button></div><div id="iBox1"></div>' +
      '<details style="margin-top:10px"><summary>How to write equations</summary><ul class="small"><li>Arrow: <code>-&gt;</code>; between species: <code> + </code> (spaces around the plus).</li><li>Every species needs a state: <code>(g)</code>, <code>(l)</code>, <code>(s)</code>, <code>(aq)</code>, or a form such as <code>(s, graphite)</code>.</li><li>Coefficients: <code>2</code>, <code>1/2</code>, <code>3/2</code>, <code>½</code> written right before the formula, e.g. <code>1/2O2(g)</code>.</li><li>Columns: <code>' + H.COLUMNS.join(', ') + '</code>. ΔH in kJ with sign. <code>text</code> is optional.</li><li>A row is flagged if an equation is unbalanced, if the steps can’t make the target, or if they can make it more than one way.</li></ul></details></div>' +
      '<div class="card"><h2>Upload problems</h2><p>A .csv or tab-delimited .txt file with the columns above.</p><input type="file" id="iFile" accept=".csv,.txt,.tsv"><div id="iRes"></div></div>' +
      '<div class="card"><h2>Problems saved in this browser</h2><p>' + (up.length ? up.length + ' uploaded problem' + (up.length > 1 ? 's' : '') + ' (they replace built-in problems with the same id).' : 'None. Students see the built-in set (' + problems.length + ' problems).') + '</p>' + (up.length ? '<button class="btn alt" id="iRemove">Remove uploaded problems</button>' : '') +
      '<h3>Updating what students see</h3><ol class="small"><li>Edit the spreadsheet (start from “Download current problems” to keep the built-in set).</li><li>Upload it here and fix any flagged rows.</li><li>Click <b>Download problems.json</b>.</li><li>On GitHub: <b>Add file → Upload files</b>, upload problems.json, and commit. It replaces the whole problem set.</li></ol></div>';
    $('#iTpl').addEventListener('click', function () { offerFile('hess-template.csv', toCSV(TEMPLATE), 'text/csv', 'iBox1'); });
    $('#iCur').addEventListener('click', function () { offerFile('hess-problems.csv', toCSV(problems), 'text/csv', 'iBox1'); });
    $('#iFile').addEventListener('change', function () { var f = this.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function () { handleUpload(String(rd.result)); }; rd.readAsText(f); });
    var rm = $('#iRemove'); if (rm) rm.addEventListener('click', function () { store.set('uploads', []); mergeProblems(); refreshAll(); renderInstr(); });
  }
  function handleUpload(text) {
    var rows = parseTable(text), seen = {}, h = ''; pending = [];
    rows.forEach(function (r, k) {
      var errs = H.validate(r); if (r.id && seen[r.id]) errs.push('duplicate id'); seen[r.id] = 1;
      var res = ''; if (!errs.length) { var s = H.solve(r); res = 'ΔH = ' + plain(fmt(s.answer)) + ' kJ (steps: ' + s.x.map(function (x) { return plain(H.fracText(x)); }).join(', ') + ')'; pending.push(r); }
      h += '<tr><td>' + (k + 2) + '</td><td>' + esc(r.id || '') + '</td><td>' + (errs.length ? '<span style="color:var(--bad)">✗ ' + esc(errs.join('; ')) + '</span>' : '<span style="color:var(--ok)">✓</span> ' + esc(res)) + '</td></tr>';
    });
    $('#iRes').innerHTML = '<p>' + rows.length + ' rows read, ' + pending.length + ' ready.</p><table class="up"><tr><th>Row</th><th>id</th><th>Result</th></tr>' + h + '</table>' +
      (pending.length ? '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="iTry">Try these in this browser</button><button class="btn alt" id="iJson">Download problems.json</button></div><div id="iBox2"></div>' : '');
    var tb = $('#iTry');
    if (tb) {
      tb.addEventListener('click', function () { var up = store.get('uploads', []), map = {}; up.forEach(function (p) { map[p.id] = p; }); pending.forEach(function (p) { map[p.id] = p; }); store.set('uploads', Object.keys(map).map(function (k) { return map[k]; })); mergeProblems(); refreshAll(); renderInstr(); $('#iRes').innerHTML = '<div class="fb ok">' + pending.length + ' problems saved in this browser. Open Coaching or Testing to try them.</div>'; });
      $('#iJson').addEventListener('click', function () { offerFile('problems.json', JSON.stringify(pending, null, 1), 'application/json', 'iBox2'); });
    }
  }

  function refreshAll() { fillPicker(); if (!C.p || !byId[C.p.id]) openCoach(problems[0].id); $('#tLv').innerHTML = levelChips(T.level); }
  function start() {
    mergeProblems(); renderReview(); coachShell(); testShell(); renderInstr();
    var last = store.get('cId', null); openCoach(byId[last] ? last : (inLevel(C.level)[0] || problems[0]).id);
    openTest(randomFrom(inLevel(T.level)).id); showTab(store.get('tab', 'coach'));
  }
  var started = false; function go() { if (!started) { started = true; start(); } }
  try {
    if (location.protocol.indexOf('http') === 0 && typeof fetch === 'function') {
      var timer = setTimeout(go, 1500);
      fetch('problems.json', { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { if (Array.isArray(j) && j.length && !started) BASE = j; clearTimeout(timer); go(); }).catch(function () { clearTimeout(timer); go(); });
    } else go();
  } catch (e) { go(); }
})();

</script>
</body>
</html>
